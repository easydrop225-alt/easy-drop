name: CI

# Bloque la fusion d'une Pull Request si le build, les types ou les tests
# échouent — pour éviter qu'un bug de calcul ou une régression de
# configuration (comme celle du 30 juillet 2026) arrive en production
# sans être détectée avant.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types TypeScript
        run: npm run type-check

      - name: Lancer les tests unitaires
        run: npm run test

      - name: Vérifier que le build de production passe
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-pour-le-build-ci
          NEXT_PUBLIC_SITE_URL: https://easy-drop-kappa.vercel.app
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder
